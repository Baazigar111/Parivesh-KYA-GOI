# fly.toml app configuration file for PARIVESH 2.0 KYA Backend
# Primary Region: 'bom' (Mumbai, India) to ensure traffic originates within India for NIC portal

app = "parivesh-kya-backend"
primary_region = "bom"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 1
